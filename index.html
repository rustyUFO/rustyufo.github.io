<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rustyUFO - Content Creator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- SPLASH SCREEN -->
    <div class="splash-screen" id="splashScreen">
        <img src="Rusty ufo.png" alt="rustyUFO" class="splash-image">
    </div>
    
    <!-- MAIN CONTENT - Using design image as background -->
    <main class="main-content" id="mainContent">
        <div class="design-background">
            <img src="2.jpg" alt="rustyUFO Layout" class="layout-image">
        </div>
        
        <!-- Interactive overlay for functionality -->
        <div class="interactive-overlay">
            <!-- Streams Box Input Area -->
            <div class="input-area streams-input"></div>
            
            <!-- Socials Box Input Area -->
            <div class="input-area socials-input"></div>
            
            <!-- Hire Me Box Input Area -->
            <div class="hire-input-area">
                <input type="email" placeholder="Your email" class="email-input">
                <button class="send-btn">Send</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
